/* =========================================================
   GATE ELECTRIC ACCENT
   ========================================================= */

.seo-gate-left::after,
.seo-gate-right::after {

    content: "";

    position: absolute;

    top: 10%;
    bottom: 10%;

    width: 3px;

    background:
        linear-gradient(
            180deg,
            transparent,
            #ff57b9,
            #ffc400,
            #ffffff,
            #ffc400,
            #ff57b9,
            transparent
        );

    box-shadow:
        0 0 8px #ffc400,
        0 0 18px #ff9100;
}


.seo-gate-left::after {
    right: 10%;
}


.seo-gate-right::after {
    left: 10%;
}


/* =========================================================
   CENTER SUN
   ========================================================= */

.seo-halley-sun {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 145px;
    height: 145px;

    transform:
        translate(-50%, -50%)
        scale(.2);

    z-index: 8;

    display: flex;

    justify-content: center;
    align-items: center;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #ffffff 0%,
            #ffe89a 10%,
            #ffbd32 30%,
            #d87900 55%,
            #111827 58%,
            #030719 100%
        );

    border:
        3px solid #ffd76a;

    box-shadow:
        0 0 10px #ffffff,
        0 0 25px #ffd76a,
        0 0 50px #ffb300,
        0 0 90px rgba(0,217,255,.65);

    opacity: 0;

    animation:
        sunAppear .7s ease .15s forwards,
        sunDisappear .8s ease 1s forwards;
}


/* =========================================================
   SUN RAYS
   ========================================================= */

.seo-halley-sun::before {

    content: "";

    position: absolute;

    inset: -24px;

    border-radius: 50%;

    background:
        conic-gradient(
            from 0deg,

            transparent 0deg,
            #ffd76a 8deg,
            transparent 16deg,

            transparent 28deg,
            #ffc400 36deg,
            transparent 44deg,

            transparent 60deg,
            #ffd76a 68deg,
            transparent 76deg,

            transparent 100deg,
            #ffc400 108deg,
            transparent 116deg,

            transparent 140deg,
            #ffd76a 148deg,
            transparent 156deg,

            transparent 180deg,
            #ffc400 188deg,
            transparent 196deg,

            transparent 220deg,
            #ffd76a 228deg,
            transparent 236deg,

            transparent 260deg,
            #ffc400 268deg,
            transparent 276deg,

            transparent 300deg,
            #ffd76a 308deg,
            transparent 316deg,

            transparent
        );

    mask:
        radial-gradient(
            circle,
            transparent 0 58%,
            #000 60% 65%,
            transparent 67%
        );

    -webkit-mask:
        radial-gradient(
            circle,
            transparent 0 58%,
            #000 60% 65%,
            transparent 67%
        );

    animation:
        sunRotate 8s linear infinite;
}


/* =========================================================
   SEO GJ. TEXT
   ========================================================= */

.seo-halley-text {

    position: relative;

    z-index: 10;

    text-align: center;

    font-family:
        Arial,
        sans-serif;

    font-size:
        17px;

    line-height:
        1.15;

    font-weight:
        900;

    letter-spacing:
        2px;

    text-transform:
        uppercase;

    color:
        #ffffff;

    text-shadow:
        0 0 5px #ffffff,
        0 0 10px #ffd76a,
        0 0 18px #ffb300;

    transform:
        scale(.65);

    opacity:
        0;

    animation:
        textReveal .6s ease .35s forwards,
        textDisappear .7s ease 1s forwards;
}


/* =========================================================
   COSMIC HORIZONTAL BEAM
   ========================================================= */

.seo-halley-beam {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 100vw;
    height: 2px;

    transform:
        translate(-50%, -50%);

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(0,102,255,.4),
            #ffc400,
            #ffffff,
            #ffc400,
            rgba(0,102,255,.4),
            transparent
        );

    box-shadow:
        0 0 10px #ffc400,
        0 0 25px rgba(0,102,255,.7);

    z-index: 6;

    animation:
        beamPulse 1.5s ease-in-out infinite;
}


/* =========================================================
   GATE OPEN
   ========================================================= */

@keyframes gateLeftOpen {

    0% {
        transform:
            translateX(0);
    }

    100% {
        transform:
            translateX(-100%);
    }

}


@keyframes gateRightOpen {

    0% {
        transform:
            translateX(0);
    }

    100% {
        transform:
            translateX(100%);
    }

}


/* =========================================================
   SUN APPEAR
   ========================================================= */

@keyframes sunAppear {

    0% {
        opacity: 0;

        transform:
            translate(-50%, -50%)
            scale(.2)
            rotate(-90deg);
    }

    70% {
        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(1.12)
            rotate(8deg);
    }

    100% {
        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(1)
            rotate(0deg);
    }

}


/* =========================================================
   SUN DISAPPEAR
   Mulai bersamaan ketika gerbang mulai terbuka
   ========================================================= */

@keyframes sunDisappear {

    0% {
        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(1);

        filter:
            brightness(1.2);
    }

    40% {
        opacity: .75;

        transform:
            translate(-50%, -50%)
            scale(.72);

        filter:
            brightness(1.7);
    }

    70% {
        opacity: .35;

        transform:
            translate(-50%, -50%)
            scale(.42);

        filter:
            brightness(2);
    }

    100% {
        opacity: 0;

        transform:
            translate(-50%, -50%)
            scale(.08);

        filter:
            brightness(2.8);
    }

}


/* =========================================================
   TEXT REVEAL
   ========================================================= */

@keyframes textReveal {

    from {
        opacity: 0;

        transform:
            scale(.65);
    }

    to {
        opacity: 1;

        transform:
            scale(1);
    }

}


/* =========================================================
   TEXT DISAPPEAR
   ========================================================= */

@keyframes textDisappear {

    0% {
        opacity: 1;

        transform:
            scale(1);
    }

    50% {
        opacity: .5;

        transform:
            scale(.75);
    }

    100% {
        opacity: 0;

        transform:
            scale(.35);
    }

}


/* =========================================================
   SUN ROTATION
   ========================================================= */

@keyframes sunRotate {

    from {
        transform:
            rotate(0deg);
    }

    to {
        transform:
            rotate(360deg);
    }

}


/* =========================================================
   BEAM PULSE
   ========================================================= */

@keyframes beamPulse {

    0%,
    100% {
        opacity: .4;
    }

    50% {
        opacity: 1;
    }

}


/* =========================================================
   COSMIC BACKGROUND BREATH
   ========================================================= */

@keyframes cosmicBreath {

    0%,
    100% {
        opacity: .65;

        transform:
            scale(1);
    }

    50% {
        opacity: 1;

        transform:
            scale(1.08);
    }

}


/* =========================================================
   STAR MOVEMENT
   ========================================================= */

@keyframes starsMove {

    0% {
        transform:
            translateY(0);
    }

    50% {
        transform:
            translateY(-18px);
    }

    100% {
        transform:
            translateY(0);
    }

}


/* =========================================================
   CENTER LIGHT
   ========================================================= */

@keyframes lightPulse {

    0%,
    100% {
        opacity: .55;

        transform:
            translate(-50%, -50%)
            scale(.95);
    }

    50% {
        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(1.08);
    }

}


/* =========================================================
   FINAL INTRO FADE
   ========================================================= */

@keyframes halleyIntroFade {

    0% {
        opacity: 1;
    }

    72% {
        opacity: 1;
    }

    100% {
        opacity: 0;

        visibility: hidden;
    }

}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 480px) {

    .seo-halley-sun {

        width:
            120px;

        height:
            120px;
    }

    .seo-halley-text {

        font-size:
            14px;

        letter-spacing:
            1.5px;
    }

    .seo-gate-left,
    .seo-gate-right {

        width:
            50%;
    }

}

</style>

</head>
